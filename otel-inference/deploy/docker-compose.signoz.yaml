# Convenience single-box SigNoz stack for the otel-inference demo.
#
# NOTE: The canonical, version-pinned deployment is the upstream bundle
# (github.com/SigNoz/signoz -> deploy/docker). Prefer that for anything real.
# This file exists so a reviewer can `docker compose up` one file and get a
# working OTLP sink at :4317/:4318 and a UI at :8080. Image tags are pinned to
# a known-good SigNoz release; bump them together, not individually.
#
# If SigNoz changes its packaging, defer to deploy/README.md.

x-clickhouse-defaults: &clickhouse-defaults
  restart: unless-stopped
  image: clickhouse/clickhouse-server:24.1.2-alpine
  tty: true
  ulimits:
    nofile:
      soft: 262144
      hard: 262144

services:
  clickhouse:
    <<: *clickhouse-defaults
    container_name: signoz-clickhouse
    hostname: clickhouse
    volumes:
      - clickhouse-data:/var/lib/clickhouse/
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8123/ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  signoz:
    image: signoz/signoz:v0.64.0
    container_name: signoz
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - "8080:8080" # UI
    environment:
      - ClickHouseUrl=tcp://clickhouse:9000
      - STORAGE=clickhouse
    restart: unless-stopped

  otel-collector:
    image: signoz/signoz-otel-collector:v0.111.5
    container_name: signoz-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ./signoz-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317" # OTLP gRPC  <- otel-inference collector exports here
      - "4318:4318" # OTLP HTTP
    restart: unless-stopped

volumes:
  clickhouse-data:
